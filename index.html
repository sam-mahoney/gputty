<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>gputty</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 13px monospace; overflow: hidden; }
  #tty { display: block; width: 100vw; height: calc(100vh - 32px); }
  #bar { box-sizing: border-box; height: 32px; display: flex; gap: 16px; align-items: center; padding: 0 10px; background: #111; border-top: 1px solid #333; }
</style>
</head>
<body>
<canvas id="tty"></canvas>
<div id="bar">
  <label>speed <input id="speed" type="range" min="0" max="4.3" step="0.01" value="1.3"></label>
  <label><input id="auto" type="checkbox" checked> auto</label>
  <span id="stats"></span>
</div>
<script type="module">
const FONT_PX = 14, MAX_LINES = 2000;
const FIRST = 32, LAST = 126, ATLAS_COLS = 16; // printable ASCII only

const $ = id => document.getElementById(id);
const canvas = $('tty');

function fail(msg, reloadOnClick = false) {
  document.body.textContent = msg;
  if (reloadOnClick) { document.body.style.cursor = 'pointer'; document.body.onclick = () => location.reload(); }
}

const adapter = await navigator.gpu?.requestAdapter();
if (!adapter) { fail('WebGPU not supported in this browser (or no usable GPU adapter)'); throw 0; }
const device = await adapter.requestDevice();
const ctx = canvas.getContext('webgpu');
const format = navigator.gpu.getPreferredCanvasFormat();
ctx.configure({ device, format });

let lost = false;
device.lost.then(info => {
  lost = true;
  if (info.reason === 'destroyed') return;
  es.close();
  clearInterval(statsTimer);
  fail(`GPU device lost${info.message ? `: ${info.message}` : ''}. Click to reload.`, true);
});
device.onuncapturederror = e => console.error('WebGPU error:', e.error.message);

// --- Glyph atlas: draw every character once with 2D canvas, upload as a texture.
// Rebuilt whenever devicePixelRatio changes (zoom, moving between displays).
let dpr, cellW, cellH, atlas;
function buildAtlas() {
  dpr = devicePixelRatio || 1;
  const fontPx = Math.round(FONT_PX * dpr);
  const font = `${fontPx}px monospace`;
  const measure = new OffscreenCanvas(1, 1).getContext('2d');
  measure.font = font;
  cellW = Math.ceil(measure.measureText('M').width);
  cellH = Math.ceil(fontPx * 1.25);

  const glyphCount = LAST - FIRST + 1;
  const atlasW = ATLAS_COLS * cellW, atlasH = Math.ceil(glyphCount / ATLAS_COLS) * cellH;
  const atlasCanvas = new OffscreenCanvas(atlasW, atlasH);
  const a = atlasCanvas.getContext('2d');
  a.fillStyle = '#000'; a.fillRect(0, 0, atlasW, atlasH);
  a.fillStyle = '#fff'; a.font = font; a.textBaseline = 'top';
  for (let i = 0; i < glyphCount; i++) {
    a.fillText(String.fromCharCode(FIRST + i), (i % ATLAS_COLS) * cellW, Math.floor(i / ATLAS_COLS) * cellH + (cellH - fontPx) / 2);
  }
  atlas?.destroy();
  atlas = device.createTexture({
    size: [atlasW, atlasH], format: 'rgba8unorm',
    usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT,
  });
  device.queue.copyExternalImageToTexture({ source: atlasCanvas }, { texture: atlas }, [atlasW, atlasH]);
}

// --- One fullscreen triangle; the fragment shader works out which cell each pixel is in.
const shader = device.createShaderModule({ code: /* wgsl */`
  struct U { cell: vec2u, grid: vec2u, atlasCols: u32 }
  @group(0) @binding(0) var<uniform> u: U;
  @group(0) @binding(1) var<storage, read> cells: array<u32>;
  @group(0) @binding(2) var atlas: texture_2d<f32>;

  @vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
    let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
    return vec4f(p * 2.0 - 1.0, 0.0, 1.0);
  }

  @fragment fn fs(@builtin(position) pos: vec4f) -> @location(0) vec4f {
    let px = vec2u(pos.xy);
    let cell = px / u.cell;
    if (cell.x >= u.grid.x || cell.y >= u.grid.y) { return vec4f(0.0, 0.0, 0.0, 1.0); }
    let g = cells[cell.y * u.grid.x + cell.x];
    let origin = vec2u(g % u.atlasCols, g / u.atlasCols) * u.cell;
    let v = textureLoad(atlas, origin + px % u.cell, 0).r;
    return vec4f(v, v, v, 1.0);
  }
`});
const pipeline = device.createRenderPipeline({
  layout: 'auto',
  vertex: { module: shader, entryPoint: 'vs' },
  fragment: { module: shader, entryPoint: 'fs', targets: [{ format }] },
  primitive: { topology: 'triangle-list' },
});
const uniforms = device.createBuffer({ size: 32, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

let cols, rows, grid, cellBuf, bindGroup, dirty = true;
function resize() {
  if ((devicePixelRatio || 1) !== dpr) buildAtlas();
  canvas.width = Math.max(1, Math.floor(canvas.clientWidth * dpr));
  canvas.height = Math.max(1, Math.floor(canvas.clientHeight * dpr));
  cols = Math.max(1, Math.floor(canvas.width / cellW));
  rows = Math.max(1, Math.floor(canvas.height / cellH));
  grid = new Uint32Array(cols * rows);
  cellBuf?.destroy();
  cellBuf = device.createBuffer({ size: grid.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(uniforms, 0, new Uint32Array([cellW, cellH, cols, rows, ATLAS_COLS, 0, 0, 0]));
  bindGroup = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: uniforms } },
      { binding: 1, resource: { buffer: cellBuf } },
      { binding: 2, resource: atlas.createView() },
    ],
  });
  dirty = true;
}
// The observer's first callback does the initial sizing.
new ResizeObserver(resize).observe(canvas);
// A DPR change doesn't always change the canvas's CSS size, so the observer may
// not fire. A resolution media query matches only the current DPR; re-arm it each time.
(function watchDpr() {
  matchMedia(`(resolution: ${devicePixelRatio}dppx)`)
    .addEventListener('change', () => { resize(); watchDpr(); }, { once: true });
})();

// --- Lines -> cell grid -> GPU. Only the last `rows` lines are visible; no wrapping.
// Incoming lines go straight into a fixed ring, so memory stays bounded even
// while a hidden tab isn't running requestAnimationFrame.
const ring = new Array(MAX_LINES);
let received = 0;
const QMARK = '?'.charCodeAt(0) - FIRST;

function draw() {
  grid.fill(0);
  const visible = Math.min(rows, received, MAX_LINES), start = received - visible;
  for (let r = 0; r < visible; r++) {
    const s = ring[(start + r) % MAX_LINES], n = Math.min(s.length, cols), base = r * cols;
    for (let c = 0; c < n; c++) {
      const code = s.charCodeAt(c);
      grid[base + c] = code >= FIRST && code <= LAST ? code - FIRST : QMARK;
    }
  }
  device.queue.writeBuffer(cellBuf, 0, grid);
  const enc = device.createCommandEncoder();
  const pass = enc.beginRenderPass({ colorAttachments: [{
    view: ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1],
  }]});
  pass.setPipeline(pipeline);
  pass.setBindGroup(0, bindGroup);
  pass.draw(3);
  pass.end();
  device.queue.submit([enc.finish()]);
}

// Everything that arrived since the last frame is drawn in one go: at 5000 lines/s
// that's ~80 lines per frame but still a single upload + draw.
function frame() {
  if (dirty && bindGroup && !lost) { draw(); dirty = false; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// --- Data stream + controls.
// Settings are per connection on the server, keyed by this id.
const id = crypto.randomUUID();
let target = 0;
const es = new EventSource(`/stream?id=${id}`);
es.onmessage = e => { ring[received++ % MAX_LINES] = e.data; dirty = true; };
es.addEventListener('rate', e => {
  target = +e.data;
  if ($('auto').checked) $('speed').value = Math.log10(Math.max(1, target));
});

const send = () => fetch(`/control?id=${id}&rate=${Math.round(10 ** $('speed').value)}&auto=${$('auto').checked ? 1 : 0}`, {
  method: 'POST', headers: { 'X-Gputty': '1' },
}).then(r => { if (!r.ok) console.warn('control rejected:', r.status); })
  .catch(err => console.warn('control request failed:', err));
// A (re)connect starts with server defaults, so push our current controls.
es.onopen = send;
$('speed').oninput = () => { $('auto').checked = false; send(); };
$('auto').onchange = send;

let lastCount = 0, lastT = performance.now();
const statsTimer = setInterval(() => {
  const now = performance.now();
  const recv = (received - lastCount) / ((now - lastT) / 1000);
  lastCount = received; lastT = now;
  $('stats').textContent = `target ${target}/s · recv ${Math.round(recv)}/s · total ${received} · ${cols}x${rows}`;
}, 500);
</script>
</body>
</html>
